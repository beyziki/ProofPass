<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KimlikKasası</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* KimlikKasası: kamu hizmeti ciddiyetinde, koyu vişne mührü ve soğuk gri yüzeyler. Kiralama sitesinden (lacivert/turkuaz) bilerek ayrı. */
:root{
  --bg:#f1f3f6; --card:#ffffff; --ink:#1a2230; --mut:#5d6b7f; --line:#dfe4ec;
  --seal:#7d1d3c; --seal-2:#4a0f26; --seal-soft:#f6e4ea; --gold:#c9a24b;
  --ok:#17794a; --ok-soft:#dcf3e6; --warn:#a4470f; --warn-soft:#fde8d8; --side:#ffffff;
  --shadow:0 1px 2px rgba(26,34,48,.06),0 8px 24px rgba(26,34,48,.07);
  --f:'Public Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --card:#161d29; --ink:#e8edf5; --mut:#97a5ba; --line:#243044;
  --seal:#e07a98; --seal-2:#4a0f26; --seal-soft:#3a1a26; --gold:#e1bd6a;
  --ok:#5fd596; --ok-soft:#10301f; --warn:#f2a36b; --warn-soft:#3a2110; --side:#121a25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --card:#161d29; --ink:#e8edf5; --mut:#97a5ba; --line:#243044;
  --seal:#e07a98; --seal-2:#4a0f26; --seal-soft:#3a1a26; --gold:#e1bd6a;
  --ok:#5fd596; --ok-soft:#10301f; --warn:#f2a36b; --warn-soft:#3a2110; --side:#121a25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.6 var(--f);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800} h2{font-size:1.15rem;font-weight:800} h3{font-size:1rem;font-weight:700}
p{margin:0}.mut{color:var(--mut)}.small{font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--seal);color:#fff;min-height:44px;transition:filter .15s,transform .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#2a0a16}}
button:hover{filter:brightness(1.08)} button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--ink);filter:none}
button.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--mut)}
input{width:100%;font:inherit;font-weight:600;padding:12px 14px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
select{width:100%;font:inherit;font-weight:600;padding:12px 14px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px color-mix(in srgb,var(--seal) 22%,transparent)}
.err{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px;font-weight:600}

.seal{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--seal),var(--seal-2));box-shadow:0 4px 12px rgba(74,15,38,.35)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand b{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}.brand small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:-2px}

/* giriş */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-l{background:radial-gradient(700px 420px at 20% 10%,color-mix(in srgb,var(--seal) 55%,#000) 0,transparent 70%),linear-gradient(160deg,var(--seal-2),#220712);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.auth-l .brand b{color:#fff}.auth-l .brand small{color:#e8b9c8}
.auth-l h1{color:#fff;max-width:14ch;font-size:clamp(2rem,4vw,3rem);letter-spacing:-.035em}
.auth-l p{color:#e6c4cf;max-width:44ch;margin-top:16px}
.auth-l ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:12px}
.auth-l li{display:flex;gap:12px;align-items:start;color:#f3dbe3;font-size:14.5px}
.auth-l li svg{flex:none;margin-top:2px;color:var(--gold)}
.auth-l .fine{font-size:12.5px;color:#c99aab}
.auth-r{display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,48px)}
.box{width:100%;max-width:430px}
.box .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.demo{margin-top:18px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 16px}
.demo h3{font-size:13.5px;margin-bottom:10px}
.demo .people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo button{background:var(--bg);color:var(--ink);border:1px solid var(--line);text-align:left;padding:9px 12px;min-height:0;font-size:13px;line-height:1.3}
.demo button small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}

/* uygulama kabuğu */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.nav{display:grid;gap:4px}
.nav button{background:transparent;color:var(--mut);text-align:left;display:flex;align-items:center;gap:10px;font-weight:700;padding:11px 12px;border-radius:10px;min-height:0}
.nav button:hover{background:var(--bg);filter:none;color:var(--ink)}
.nav button[aria-current="page"]{background:var(--seal-soft);color:var(--seal)}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--seal),var(--seal-2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.me b{display:block;font-size:14px}.me span{font-size:12px;color:var(--mut)}
.me button{margin-left:auto;padding:7px 10px;min-height:0;font-size:12.5px}
.main{padding:clamp(18px,3vw,36px);max-width:1080px;width:100%}
.mhead{margin-bottom:24px}.mhead p{margin-top:6px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}

/* dijital kimlik kartı */
.overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.idcard{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:22px 24px 20px;aspect-ratio:1.586;min-height:240px;background:linear-gradient(135deg,#8a2245 0%,#4a0f26 60%,#2b0816 100%);box-shadow:0 18px 40px rgba(74,15,38,.35);display:flex;flex-direction:column;justify-content:space-between}
.idcard::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 120%,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);pointer-events:none}
.idcard>*{position:relative}
.idtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:#f0cdd8}
.idtop .demo-tag{border:1px solid rgba(255,255,255,.4);padding:3px 9px;border-radius:999px;font-size:11px}
.idmid{display:flex;gap:18px;align-items:center}
.photo{width:76px;height:94px;border-radius:12px;background:linear-gradient(160deg,#f0cdd8,#b9708a);display:grid;place-items:center;font-weight:800;font-size:28px;color:#4a0f26;flex:none}
.idmid dl{margin:0;display:grid;grid-template-columns:auto auto;gap:6px 22px}
.idmid dt{font-size:11px;color:#e6b9c8;font-weight:600}.idmid dd{margin:0 0 2px;font-weight:700;font-size:14.5px}
.idname{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;grid-column:1/-1;margin-bottom:2px}
.idbot{display:flex;justify-content:space-between;align-items:end}
.chip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#e9cf8f,#b58b34);position:relative}
.chip::after{content:"";position:absolute;inset:6px 10px;border:1.5px solid rgba(74,15,38,.45);border-radius:3px}
.idno{font-size:1.05rem;letter-spacing:.12em;font-weight:700;font-variant-numeric:tabular-nums}
.tiles{display:grid;gap:14px}
.tile b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}.tile span{color:var(--mut);font-size:13px}
.note{background:var(--seal-soft);color:var(--seal);border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600}

/* bilgi blokları */
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
dl.f{margin:12px 0 0}dl.f dt{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:12px}dl.f dd{margin:2px 0 0;font-weight:700;word-break:break-word;display:flex;gap:10px;align-items:center}
.rev{background:transparent;color:var(--seal);padding:2px 8px;min-height:0;font-size:12.5px;border:1px solid var(--line)}

/* izinler ve kayıt */
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{font-size:12.5px;color:var(--mut);font-weight:700}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ok-soft);color:var(--ok)}.pill.r{background:var(--warn-soft);color:var(--warn)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.tl li:last-child{border:0}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:6px}.tl .dot.r{background:var(--warn)}.tl .dot.g{background:var(--mut)}
.tl time{font-size:12.5px;color:var(--mut)}.tl b{display:block}

/* onay ekranı */
.consent-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,4vw,40px);gap:18px}
.consent{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}
.rp{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.rp .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,#0f4c81,#0a7f76);display:grid;place-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.box2{border-radius:14px;padding:14px 16px;font-size:14px}.box2 b{display:block;margin-bottom:6px}.box2 ul{margin:0;padding-left:18px}.box2 li{margin:3px 0}
.box2.out{background:var(--warn-soft);color:var(--warn)}.box2.in{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.who{font-size:13px;color:var(--mut);margin-top:16px;display:flex;gap:8px;align-items:center}
.demo-foot{font-size:12.5px;color:var(--mut);text-align:center;max-width:560px}

@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-l{padding:28px 22px}.auth-l ul{display:none}.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.nav{display:flex;flex-wrap:wrap}.me{margin:0 0 0 auto;border:0;padding:0}.overview,.cols{grid-template-columns:1fr}}
@media (max-width:480px){.idmid{gap:12px}.photo{width:60px;height:76px}.demo .people{grid-template-columns:1fr}}
</style></head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,o)=>{const r=await fetch(u,o&&o.body?{...o,headers:{'Content-Type':'application/json'},body:JSON.stringify(o.body)}:o);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Hata'),{status:r.status});return j};
const P=new URLSearchParams(location.search), isConsent=location.pathname==='/onay';
let me=null,tab='ozet';
const I={
 seal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="#fff"/></svg>',
 chk:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>',
 home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',
 user:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
 key:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M16 6l3 3"/></svg>',
 list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
};
const maskTc=t=>t.slice(0,3)+' '+'•••'+' '+'••'+t.slice(-3);
const fmtTc=t=>t.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1 $2 $3 $4');
const fmtDate=s=>new Date(s+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});

async function boot(){
  try{me=await api('/api/me')}catch{me=null}
  if(!me) return loginView();
  isConsent?consentView():shellView();
}
async function logout(){await api('/api/logout',{method:'POST',body:{}});tab='ozet';boot()}

async function loginView(){
  let demo=[];try{demo=await api('/api/demo-users')}catch{}
  app.innerHTML=`<div class="auth"><section class="auth-l"><div class="brand"><span class="seal">${I.seal}</span><div><b>KimlikKasası</b><small>Dijital kimlik portalı · demo</small></div></div>
  <div><h1>Bilgilerin sende kalsın.</h1><p>Kurumlar yalnızca ihtiyaç duydukları cevabı alır. Doğum tarihini, adresini ve numaralarını kime ne zaman verdiğini buradan görürsün.</p>
  <ul><li>${I.chk}<span>Her paylaşım için önce senden izin istenir.</span></li><li>${I.chk}<span>“25 yaş ve üzeri” veya “ehliyet en az 2 yıllık” gibi sorular, tarih verilmeden kanıtlanabilir.</span></li><li>${I.chk}<span>Verilen her izin erişim kaydına yazılır.</span></li></ul></div>
  <div class="fine">Bu portal bir ders demosudur. Kişiler ve numaralar uydurmadır; gerçek bir kamu kurumuyla ilgisi yoktur.</div></section>
  <section class="auth-r"><div class="box"><div class="card"><h1 style="font-size:1.6rem">Giriş yap</h1><p class="mut" style="margin-top:6px">${isConsent?'Bir kurum, bilgilerinin kullanılması için izin istiyor. Önce giriş yap.':'T.C. kimlik numaran ve şifrenle giriş yap.'}</p>
  <form id="lf"><label for="tc">T.C. kimlik no</label><input id="tc" inputmode="numeric" maxlength="11" autocomplete="off" required><label for="pw">Şifre</label><input id="pw" type="password" required><div id="e"></div><div style="margin-top:18px"><button style="width:100%" class="pri">Giriş yap</button></div></form>
  <p class="mut small" style="margin-top:16px;text-align:center">Hesabın yok mu? <a href="#" id="toReg" style="color:var(--seal);font-weight:700">Demo hesap oluştur</a></p></div>
  <div class="demo"><h3>Demo hesapları · şifre: demo123</h3><div class="people">${demo.map(d=>`<button type="button" data-tc="${d.tc}">${esc(d.ad)} ${esc(d.soyad)}<small>${fmtTc(d.tc)}</small></button>`).join('')}</div></div></div></section></div>`;
  $('#toReg').onclick=e=>{e.preventDefault();registerView()};
  app.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{$('#tc').value=b.dataset.tc;$('#pw').value='demo123'});
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:{tc:$('#tc').value.trim(),password:$('#pw').value}});boot()}catch(x){$('#e').innerHTML=`<div class="err">${esc(x.message)}</div>`}};
}

const IL=['Kayseri','Ankara','İstanbul','İzmir','Bursa','Konya'];
function registerView(done){
  const card=app.querySelector('.box');
  if(done){card.innerHTML=`<div class="card"><h1 style="font-size:1.5rem">Hesabın hazır</h1><p class="mut" style="margin-top:8px">Sana sentetik bir T.C. kimlik numarası atandı. Giriş için bunu ve belirlediğin şifreyi kullan.</p>
    <div style="margin:18px 0;padding:16px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);text-align:center"><div class="mut small">T.C. kimlik no (sentetik)</div><div style="font:800 1.5rem/1.4 monospace;letter-spacing:.08em">${fmtTc(done.tc)}</div></div>
    <button class="pri" style="width:100%" id="goLogin">Giriş ekranına dön</button></div>`;
    $('#goLogin').onclick=async()=>{await loginView();$('#tc').value=done.tc;$('#pw').focus()};return}
  card.innerHTML=`<div class="card"><h1 style="font-size:1.5rem">Demo hesap oluştur</h1><p class="mut small" style="margin-top:6px">Bu bir ders demosudur. Gerçek kimlik bilgisi veya gerçek şifreni girme; T.C. kimlik no sana otomatik ve sentetik olarak atanır.</p>
   <form id="rf" novalidate><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px"><div><label for="rAd">Ad</label><input id="rAd" maxlength="30" autocomplete="off"></div><div><label for="rSoy">Soyad</label><input id="rSoy" maxlength="30" autocomplete="off"></div></div>
   <label for="rDg">Doğum tarihi</label><input id="rDg" type="date" min="1920-01-01">
   <label for="rIl">İl</label><select id="rIl">${IL.map(x=>`<option>${x}</option>`).join('')}</select>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px"><div><label for="rSn">Ehliyet sınıfı</label><select id="rSn"><option value="">Ehliyetim yok</option><option>A2</option><option selected>B</option><option>C</option></select></div><div><label for="rEt">Ehliyet alım tarihi</label><input id="rEt" type="date"></div></div>
   <label for="rPw">Şifre (en az 6 karakter)</label><input id="rPw" type="password" autocomplete="new-password"><label for="rPw2">Şifre tekrar</label><input id="rPw2" type="password" autocomplete="new-password">
   <div id="re"></div><div style="margin-top:18px;display:grid;gap:8px"><button class="pri" style="width:100%">Hesap oluştur</button><button type="button" class="ghost" id="backLogin">Girişe dön</button></div></form></div>`;
  const sn=$('#rSn'),et=$('#rEt');const sync=()=>{et.disabled=!sn.value;if(!sn.value)et.value=''};sn.onchange=sync;sync();
  $('#backLogin').onclick=()=>loginView();
  $('#rf').onsubmit=async e=>{e.preventDefault();const err=m=>$('#re').innerHTML=`<div class="err">${esc(m)}</div>`;
    if($('#rPw').value!==$('#rPw2').value)return err('Şifreler aynı değil.');
    try{const r=await api('/api/register',{method:'POST',body:{ad:$('#rAd').value,soyad:$('#rSoy').value,dogum_tarihi:$('#rDg').value,il:$('#rIl').value,ehliyet_sinifi:sn.value||null,ehliyet_tarihi:et.value||null,password:$('#rPw').value}});registerView(r)}catch(x){err(x.message)}};
}

function shellView(){
  const items=[['ozet','Genel bakış',I.home],['bilgi','Kimlik bilgilerim',I.user],['izin','İzinlerim',I.key],['log','Erişim kaydı',I.list]];
  app.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><span class="seal">${I.seal}</span><div><b>KimlikKasası</b><small>Dijital kimlik portalı</small></div></div>
  <nav class="nav" aria-label="Menü">${items.map(([k,l,i])=>`<button class="ghost-nav" data-t="${k}" ${tab===k?'aria-current="page"':''}>${i}${l}</button>`).join('')}</nav>
  <div class="me"><div class="av">${esc(me.ad[0]+me.soyad[0])}</div><div><b>${esc(me.ad)} ${esc(me.soyad)}</b><span>${maskTc(me.tc)}</span></div><button class="ghost" id="out">Çıkış</button></div></aside>
  <main class="main" id="mv"></main></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shellView()});
  $('#out').onclick=logout;
  ({ozet:overview,bilgi:infoView,izin:consentsView,log:logView})[tab]();
}
const head=(t,p)=>`<div class="mhead"><h1>${t}</h1><p>${p}</p></div>`;

async function overview(){
  const L=await api('/api/me/access-log');
  const grants=L.filter(r=>r.kind==='onay');const orgs=new Set(grants.map(r=>r.audience));
  $('#mv').innerHTML=head(`Merhaba, ${esc(me.ad)}`,'Bilgilerin yalnızca senin iznin ve sınırlı biçimde kurumlara ulaşır.')+
  `<div class="overview"><div class="idcard"><div class="idtop"><span>KimlikKasası dijital kimlik</span><span class="demo-tag">SENTETİK</span></div>
   <div class="idmid"><div class="photo">${esc(me.ad[0]+me.soyad[0])}</div><dl><div class="idname" style="grid-column:1/-1">${esc(me.ad)} ${esc(me.soyad)}</div><div><dt>Doğum tarihi</dt><dd>${fmtDate(me.dogum_tarihi)}</dd></div><div><dt>Doğum yeri</dt><dd>${esc(me.dogum_yeri)}</dd></div></dl></div>
   <div class="idbot"><div class="chip"></div><div class="idno">${fmtTc(me.tc)}</div></div></div>
   <div class="tiles"><div class="card tile"><b>${orgs.size}</b><span>izin verdiğin kurum</span></div><div class="card tile"><b>${L.filter(r=>r.kind==='veri-paylasimi').length}</b><span>tam veri paylaşımı</span></div>
   <div class="note">${L.some(r=>r.kind==='veri-paylasimi')?'Bir kuruma tam veri verdin. Ayrıntı için Erişim kaydı sekmesine bak.':'Henüz hiçbir kuruma tam veri vermedin.'}</div></div></div>`;
}
function rowsOf(list){return list.map(([k,v,s])=>`<dt>${k}</dt><dd>${s?`<span data-v="${esc(v)}" data-m="${esc(maskTc(String(v)))}">${esc(maskTc(String(v)))}</span><button class="rev ghost" data-rev>Göster</button>`:esc(v)}</dd>`).join('')}
function infoView(){
  const S=(t,r)=>`<div class="card"><h2>${t}</h2><dl class="f">${rowsOf(r)}</dl></div>`;
  $('#mv').innerHTML=head('Kimlik bilgilerim','Bu bilgiler yalnızca sana görünür. Hassas numaralar gizli gelir.')+`<div class="sections">`+
   S('Kimlik',[['T.C. kimlik no',me.tc,1],['Ad soyad',`${me.ad} ${me.soyad}`],['Cinsiyet',me.cinsiyet],['Doğum tarihi',fmtDate(me.dogum_tarihi)],['Doğum yeri',me.dogum_yeri],['Anne adı',me.anne_adi],['Baba adı',me.baba_adi],['Medeni hal',me.medeni_hal]])+
   S('İletişim ve adres',[['Telefon',me.telefon],['E-posta',me.eposta],['İl / ilçe',`${me.il} / ${me.ilce}`],['Adres',me.adres]])+
   S('Ehliyet ve araç',[['Ehliyet sınıfı',me.ehliyet_sinifi],['Ehliyet alım tarihi',me.ehliyet_tarihi],['Kayıtlı araç plakası',me.arac_plaka]])+
   S('Vergi, sigorta, eğitim',[['Vergi no',me.vergi_no,1],['SGK sicil no',me.sgk_no,1],['Öğrenim durumu',me.egitim],['Meslek',me.meslek]])+`</div>`;
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{const s=b.previousElementSibling,on=s.textContent===s.dataset.m;s.textContent=on?s.dataset.v:s.dataset.m;b.textContent=on?'Gizle':'Göster'});
}
async function consentsView(){
  const L=await api('/api/me/access-log');const by={};
  for(const r of L.filter(r=>r.kind!=='giris'))(by[r.audience]??=[]).push(r);
  const rows=Object.entries(by).map(([org,rs])=>{const full=rs.some(r=>r.kind==='veri-paylasimi'),last=rs[0];
    return `<tr><td><b>${esc(org)}</b></td><td>${full?'<span class="pill r">Tam veri paylaşıldı</span>':'<span class="pill">Yalnızca imzalı kimlik kartı</span>'}</td><td class="small mut">${new Date(last.ts).toLocaleString('tr-TR')}</td><td class="small">${full?'Ad, T.C. no, doğum tarihi':'Doğum tarihi paylaşılmadı'}</td></tr>`}).join('');
  $('#mv').innerHTML=head('İzinlerim','Bilgilerine erişim isteyen kurumlar ve onların ne aldığı.')+`<div class="card tw">${rows?`<table><tr><th>Kurum</th><th>Durum</th><th>Son işlem</th><th>Kuruma giden bilgi</th></tr>${rows}</table>`:'<p class="mut">Henüz hiçbir kuruma izin vermedin. Bir kurum izin istediğinde burada görünür.</p>'}</div>`;
}
const K={giris:['Giriş yaptın','g'],onay:['İzin verdin',''],'kimlik-karti':['Yaş kimlik kartı verildi',''],'veri-paylasimi':['Tam veri paylaşıldı','r']};
async function logView(){
  const L=await api('/api/me/access-log');
  $('#mv').innerHTML=head('Erişim kaydı','Verilerinin kime, ne zaman ve neden verildiği.')+`<div class="card">${L.length?`<ul class="tl">${L.map(r=>{const k=K[r.kind]||[r.kind,'g'];return `<li><span class="dot ${k[1]}"></span><div><b>${esc(k[0])} · ${esc(r.audience)}</b><span class="small mut">${esc(r.detail)}</span><br><time>${new Date(r.ts).toLocaleString('tr-TR')}</time></div></li>`}).join('')}</ul>`:'<p class="mut">Henüz kayıt yok.</p>'}</div>`;
}

async function consentView(){
  const cid=P.get('client_id'),ru=P.get('redirect_uri'),mode=P.get('mode');
  let c;try{c=await api(`/api/oauth/client?client_id=${encodeURIComponent(cid)}&redirect_uri=${encodeURIComponent(ru||'')}`)}catch{c=null}
  if(!c||!c.redirect_ok||!['zk','classic'].includes(mode)){app.innerHTML=`<div class="consent-wrap"><div class="consent"><h1>Geçersiz istek</h1><p class="mut" style="margin-top:8px">Kurum veya yönlendirme adresi tanımlı değil. Güvenliğin için işlem durduruldu.</p></div></div>`;return}
  const zk=mode==='zk';
  app.innerHTML=`<div class="consent-wrap"><div class="brand"><span class="seal">${I.seal}</span><div><b>KimlikKasası</b><small>İzin isteği</small></div></div>
  <div class="consent"><div class="rp"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><div><h1 style="font-size:1.4rem">${esc(c.name)} izin istiyor</h1><p class="mut small">${zk?'Yaşının 25 ve üzeri olduğunu ve ehliyetinin uygunluğunu kanıtlamak için imzalı bir dijital kimlik kartı istiyor.':'Kimlik doğrulama için bilgilerini doğrudan istiyor (klasik yöntem).'}</p></div></div>
  <div class="cols"><div class="box2 out"><b>Kuruma giden bilgi</b><ul>${zk?'<li>Hiçbir kişisel bilgi gitmez</li><li>Kuruma yalnızca üç evet/hayır sonucu ulaşır: 25 yaş ve üzeri, ehliyet en az 2 yıllık, ehliyet sınıfı uygun</li>':'<li>Ad ve soyad</li><li>T.C. kimlik numarası</li><li>Doğum tarihi</li><li>Ehliyet sınıfı ve ehliyet alım tarihi</li>'}</ul></div>
  <div class="box2 in"><b>Sende kalan</b><ul>${zk?'<li>Doğum tarihin, ehliyet tarihin ve sınıfın yalnızca tarayıcındaki cüzdana imzalı kart olarak gelir</li><li>Kuruma gösterilen kanıtta bu bilgilerin hiçbiri yoktur</li><li>Kurumdaki takma adın bu kuruma özeldir</li>':'<li>Adres, telefon, vergi/SGK ve diğer tüm bilgilerin</li>'}</ul></div></div>
  ${zk?'':'<div class="note" style="margin-bottom:16px">Bu mod karşılaştırma için gösterilen klasik yöntemdir. Mahremiyet açısından daha zayıftır.</div>'}
  <div id="e"></div><div class="row"><button id="ok" class="pri">İzin ver</button><button class="ghost" id="no">Reddet</button></div>
  <div class="who"><span class="av" style="width:26px;height:26px;font-size:11px">${esc(me.ad[0]+me.soyad[0])}</span>${esc(me.ad)} ${esc(me.soyad)} olarak giriş yaptın · T.C. ${maskTc(me.tc)}</div></div>
  <p class="demo-foot">Bu izin erişim kaydına yazılır. Sentetik demo verisi; gerçek bir kamu hizmeti değildir.</p></div>`;
  $('#no').onclick=()=>location.href=`${ru}?error=access_denied`;
  $('#ok').onclick=async()=>{$('#ok').disabled=true;try{const r=await api('/api/oauth/authorize',{method:'POST',body:{client_id:cid,redirect_uri:ru,mode}});location.href=r.redirect}catch(x){$('#e').innerHTML=`<div class="err">${esc(x.message)}</div>`;$('#ok').disabled=false}};
}
boot();
</script></body></html>
